c_stdlib:
  - sysroot                    # [linux]
  - macosx_deployment_target   # [osx]
c_stdlib_version:              # [unix]
  - 2.17                       # [linux]
  # macOS 13.3: kalman (Accelerate CBLAS) needs 13.3
  - 13.3                     # [osx]

# root 6.36 dropped: 6.36.04 was only ever published for linux-64, no
# linux-aarch64 build exists, so every aarch64 attempt against that
# variant slot was unsatisfiable ("root==6.36.10=py314..." in the
# solver's error is its own garbled placeholder for the missing build,
# not a real version). 6.38 is published on both architectures.
root:
  - 6.38

libtorch:
  - 2.8.0

# A CPU build everywhere and a CUDA build on Linux, run with conda-forge's
# libtorch cpu_generic / cuda129_generic (2.8.0 has CUDA 12.9 only). Both are
# compiled the same way, without nvcc (meta.yaml). hep-forge CI solves the
# CUDA build with CONDA_OVERRIDE_CUDA (no GPU on the runners) when this key
# is present.
cuda_compiler_version:
  - None
  - 12.9                 # [linux]

# ---- Compiler floor (ABI), Linux only: the selector is on every item, since
# conda-build drops only the lines whose selector is false.
c_compiler_version:      # [linux]
  - 16                   # [linux]
cxx_compiler_version:    # [linux]
  - 16                   # [linux]
libgcc_version:          # [linux]
  - 16.*                 # [linux]
libstdcxx_version:       # [linux]
  - 16.*                 # [linux]

# conda-forge root_base variant (cxx20/cxx23 in its build string)
root_cxx_standard:
  - 23

# conda-forge root_base is built once per Python
python:
  - "3.12"
